<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>吃饭救星 - 全国美食随机推荐</title>
 <meta property="og:title" content="吃饭救星 - 选择困难症的终极解药">
 <meta property="og:description" content="随机推荐美食，定位附近餐厅，一键点外卖！川渝美食为主，覆盖全国。">
 <meta property="og:type" content="website">
 <style>
 * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
 :root {
 --primary-color: #FF9F43;
 --primary-dark: #e8903a;
 --dark-bg: #1a1a2e;
 --panel-bg: rgba(255, 255, 255, 0.95);
 --text-color: #333;
 --text-secondary: #666;
 --text-muted: #999;
 --shadow-color: rgba(255, 159, 67, 0.2);
 }
 body.lunch { --primary-color: #FF9F43; --shadow-color: rgba(255, 159, 67, 0.25); }
 body.afternoon { --primary-color: #FF6B9D; --shadow-color: rgba(255, 107, 157, 0.25); }
 body.dinner { --primary-color: #EE5A52; --shadow-color: rgba(238, 90, 82, 0.25); }
 body {
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 align-items: center;
 padding: 16px;
 padding-bottom: 80px;
 overflow-x: hidden;
 }
 /* 背景 */
 .bg-wrapper {
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 z-index: -1;
 background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%);
 }
 body.afternoon .bg-wrapper { background: linear-gradient(135deg, #2d1b3d 0%, #1a1a2e 50%, #2d1b3d 100%); }
 body.dinner .bg-wrapper { background: linear-gradient(135deg, #1a1a2e 0%, #2d1f1f 50%, #1a1a2e 100%); }
 /* Hero Banner - AI图片主视觉 */
 .hero-banner {
 width: 100%;
 max-width: 420px;
 border-radius: 16px;
 overflow: hidden;
 margin-bottom: 16px;
 box-shadow: 0 8px 32px rgba(0,0,0,0.3);
 }
 .hero-banner img {
 width: 100%;
 display: block;
 }
 /* 装饰光晕 */
 .glow {
 position: fixed;
 border-radius: 50%;
 filter: blur(80px);
 opacity: 0.15;
 z-index: -1;
 pointer-events: none;
 }
 .glow-1 { width: 300px; height: 300px; background: var(--primary-color); top: -100px; left: -100px; }
 .glow-2 { width: 400px; height: 400px; background: var(--primary-color); bottom: -150px; right: -150px; }
 body.afternoon .glow-1, body.afternoon .glow-2 { background: #FF6B9D; }
 body.dinner .glow-1, body.dinner .glow-2 { background: #EE5A52; }
 .container { position: relative; z-index: 1; width: 100%; max-width: 420px; }
 /* 时段选择器 */
 .time-selector {
 display: flex;
 background: rgba(255, 255, 255, 0.15);
 border-radius: 16px;
 padding: 4px;
 margin-bottom: 16px;
 backdrop-filter: blur(10px);
 border: 1px solid rgba(255, 255, 255, 0.1);
 }
 .time-tab {
 flex: 1;
 padding: 12px 8px;
 text-align: center;
 font-size: 14px;
 font-weight: 600;
 color: rgba(255, 255, 255, 0.7);
 cursor: pointer;
 border-radius: 12px;
 transition: all 0.3s ease;
 border: none;
 background: transparent;
 }
 .time-tab.active {
 background: var(--primary-color);
 color: white;
 box-shadow: 0 4px 15px var(--shadow-color);
 }
 .time-tab .icon { font-size: 20px; display: block; margin-bottom: 4px; }
 /* 主面板 */
 .panel {
 background: var(--panel-bg);
 border-radius: 24px;
 padding: 20px 16px;
 box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.3);
 backdrop-filter: blur(20px);
 position: relative;
 overflow: hidden;
 }
 .brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
 .brand-icon { width: 8px; height: 8px; background: var(--primary-color); border-radius: 2px; }
 .brand-text { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; }
 .main-title { text-align: center; font-size: 20px; font-weight: 700; color: var(--text-color); margin-bottom: 16px; }
 .main-title .highlight { color: var(--primary-color); }
 /* 步骤指示器 */
 .step-indicator { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
 .step-dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; transition: all 0.3s ease; }
 .step-dot.active { background: var(--primary-color); width: 24px; border-radius: 4px; }
 .step-dot.completed { background: var(--primary-color); }
 /* 主按钮 */
 .main-btn {
 display: block;
 width: 100%;
 padding: 16px 24px;
 background: var(--primary-color);
 border: none;
 border-radius: 14px;
 font-size: 17px;
 font-weight: 700;
 color: white;
 cursor: pointer;
 transition: all 0.3s ease;
 box-shadow: 0 6px 20px var(--shadow-color);
 }
 .main-btn:active { transform: scale(0.98); }
 .main-btn.pulse { animation: pulse 2s infinite; }
 @keyframes pulse { 0%, 100% { box-shadow: 0 6px 20px var(--shadow-color); } 50% { box-shadow: 0 6px 30px var(--shadow-color), 0 0 0 10px transparent; } }
 /* 食物结果区 */
 .food-section { margin-top: 20px; text-align: center; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
 .food-label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
 .food-result { font-size: 26px; font-weight: 700; color: var(--text-color); min-height: 36px; transition: all 0.3s ease; padding: 0 10px; }
 .food-result.changing { animation: fadeInOut 0.5s ease; }
 @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(-10px) scale(0.9); } 50% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
 .food-tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
 .food-tag { padding: 4px 12px; background: rgba(255, 159, 67, 0.15); border-radius: 20px; font-size: 12px; color: var(--primary-color); }
 body.afternoon .food-tag { background: rgba(255, 107, 157, 0.15); color: #FF6B9D; }
 body.dinner .food-tag { background: rgba(238, 90, 82, 0.15); color: #EE5A52; }
 /* 操作按钮组 */
 .btn-group { display: flex; gap: 10px; margin-top: 20px; }
 .btn-agree { flex: 1; padding: 13px 16px; background: var(--primary-color); border: none; border-radius: 12px; font-size: 14px; font-weight: 600; color: white; cursor: pointer; transition: all 0.3s ease; }
 .btn-agree:active { transform: scale(0.98); }
 .btn-change { flex: 1; padding: 13px 16px; background: rgba(0,0,0,0.08); border: none; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease; }
 .btn-change:active { transform: scale(0.98); }
 /* 城市选择 */
 .city-section { margin-top: 20px; padding-top: 16px; border-top: 1px dashed rgba(0,0,0,0.1); }
 .city-label { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 10px; }
 .city-tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
 .city-tab { padding: 7px 14px; background: rgba(0,0,0,0.05); border: 2px solid transparent; border-radius: 20px; font-size: 12px; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease; }
 .city-tab.active { background: white; border-color: var(--primary-color); color: var(--primary-color); }
 /* 搜索区 - 新设计 */
 .search-section { margin-top: 16px; }
 .search-title { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 10px; }
 .search-btns { display: flex; flex-direction: column; gap: 8px; }
 .search-btn {
 display: flex;
 align-items: center;
 padding: 12px 14px;
 background: white;
 border: 2px solid var(--primary-color);
 border-radius: 12px;
 font-size: 14px;
 font-weight: 600;
 color: var(--primary-color);
 cursor: pointer;
 transition: all 0.3s ease;
 gap: 10px;
 }
 .search-btn:active { background: var(--primary-color); color: white; }
 .search-btn .icon { font-size: 18px; }
 .search-btn .text { flex: 1; text-align: left; }
 .search-btn .arrow { font-size: 14px; opacity: 0.6; }
 /* 复制搜索区 */
 .copy-search-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.08); }
 .copy-search-title { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 10px; }
 .copy-btns { display: flex; gap: 8px; }
 .copy-btn { flex: 1; padding: 12px 8px; border-radius: 12px; font-size: 13px; font-weight: 600; color: white; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 4px; }
 .copy-btn:active { transform: scale(0.97); }
 .copy-btn.meituan { background: linear-gradient(135deg, #FF6B00, #FF9F43); }
 .copy-btn.ele { background: linear-gradient(135deg, #00B5FF, #0099FF); }
 .copy-btn .icon { font-size: 20px; }
 .copy-btn .text { font-size: 12px; }
 /* 地图按钮 */
 .map-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: white; border: 2px solid var(--primary-color); border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--primary-color); cursor: pointer; transition: all 0.3s ease; margin-top: 10px; }
 .map-btn:active { background: var(--primary-color); color: white; }
 /* 附近门店列表 */
 .nearby-stores { margin-top: 16px; }
 .nearby-title { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
 .store-list { display: flex; flex-direction: column; gap: 8px; }
 .store-item {
  padding: 12px;
  background: white;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  border: 2px solid transparent;
 }
 .store-item:active { border-color: var(--primary-color); background: rgba(255, 159, 67, 0.05); }
 .store-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
 .store-name { font-size: 15px; font-weight: 600; color: var(--text-color); display: flex; align-items: center; gap: 6px; }
 .store-distance { font-size: 12px; color: var(--primary-color); font-weight: 600; display: flex; align-items: center; gap: 4px; }
 .store-rating { font-size: 12px; color: #FF9500; }
 .store-address { font-size: 12px; color: var(--text-secondary); display: flex; align-items: flex-start; gap: 6px; }
 .store-nav-btn { 
  display: inline-flex; 
  align-items: center; 
  gap: 4px; 
  padding: 6px 10px; 
  background: var(--primary-color); 
  color: white; 
  border-radius: 8px; 
  font-size: 12px; 
  font-weight: 600; 
  margin-top: 8px; 
  transition: all 0.3s ease;
 }
 .store-nav-btn:active { transform: scale(0.95); }
 .loading-state { text-align: center; padding: 20px; color: var(--text-muted); }
 .loading-state .spinner { font-size: 24px; animation: spin 1s linear infinite; margin-bottom: 8px; }
 @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
 .error-state { text-align: center; padding: 16px; color: var(--text-secondary); font-size: 13px; }
 .retry-btn { display: inline-block; padding: 8px 16px; background: var(--primary-color); color: white; border-radius: 8px; font-size: 13px; font-weight: 600; margin-top: 10px; cursor: pointer; border: none; }
 .retry-btn:active { transform: scale(0.95); }
 /* 支持区 */
 .support-section { margin-top: 16px; text-align: center; }
 .support-btn { font-size: 12px; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 8px 16px; text-decoration: underline; opacity: 0.6; transition: opacity 0.3s; }
 .support-btn:hover { opacity: 1; }
 /* 其他 */
 .hidden { display: none !important; }
 .toast {
 position: fixed;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 background: rgba(0, 0, 0, 0.88);
 color: white;
 padding: 20px 28px;
 border-radius: 14px;
 font-size: 14px;
 z-index: 1000;
 opacity: 0;
 transition: opacity 0.3s ease;
 pointer-events: none;
 text-align: center;
 max-width: 280px;
 line-height: 1.6;
 }
 .toast.show { opacity: 1; }
 .footer { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: 16px; font-size: 11px; color: rgba(255, 255, 255, 0.4); background: linear-gradient(to top, rgba(26, 26, 46, 0.8), transparent); z-index: 10; }
 </style>
</head>

// 获取位置：优先GPS，失败用城市中心
function getLocation() {
 return new Promise((resolve) => {
 if (navigator.geolocation) {
 navigator.geolocation.getCurrentPosition(
 (position) => {
 const lng = position.coords.longitude;
 const lat = position.coords.latitude;
 currentLocation = `${lng},${lat}`;
 currentLocationName = '我的位置';
 resolve(true);
 },
 (error) => {
 console.log('GPS定位失败，使用城市中心点', error);
 useCityCenter(resolve);
 },
 { timeout: 8000, enableHighAccuracy: false }
 );
 } else {
 useCityCenter(resolve);
 }
 });
}

function useCityCenter(resolve) {
 const center = cityCenters[currentCity] || cityCenters['南充'];
 currentLocation = center;
 currentLocationName = currentCity;
 if (resolve) resolve(false);
}

// 搜索附近门店
async function searchNearbyStores() {
 nearbyTitle.innerHTML = '<span>📍</span><span>正在搜索附近的店...</span>';
 storeList.innerHTML = '<div class="loading-state"><div class="spinner">🔄</div><div>正在定位并搜索...</div></div>';
 
 const located = await getLocation();
 if (!located) {
 nearbyTitle.innerHTML = '<span>📍</span><span>使用 ' + currentLocationName + ' 位置搜索</span>';
 }
 
 // 生成搜索关键词 - 用分类词搜索更精准（高德搜菜品名几乎匹配不到店）
 const categoryKw = categorySearchKeywords[currentCategory] || '川菜馆';
 const keywords = categoryKw.split(' ').filter(Boolean);
 // 如果菜品名本身就是品类词（如"火锅""串串"），加上菜品名搜
 if(['火锅','串串','冒菜','烧烤','干锅','黄焖鸡','麻辣香锅'].includes(currentFood)){
  keywords.unshift(currentFood);
 }
 
 try {
 const allStores = [];
 const seenNames = new Set();
 
 // 分别搜索菜品名和分类词
 for (const kw of keywords) {
 const stores = await searchByKeyword(kw);
 stores.forEach(store => {
 if (!seenNames.has(store.name)) {
 seenNames.add(store.name);
 allStores.push(store);
 }
 });
 }
 
 // 按距离排序
 allStores.sort((a, b) => a.distance - b.distance);
 
 // 取前10个
 const results = allStores.slice(0, 10);
 
 // 更新标题，告诉用户搜的是什么类型的店
 const catName = categoryNames[currentCategory] || '美食';
 const catIcon = categoryIcons[currentCategory] || '🍽️';
 nearbyTitle.innerHTML = `<span>${catIcon}</span><span>附近能吃${currentFood}的${catName}（${results.length}家）</span>`;
 
 if (results.length > 0) {
 renderStoreList(results);
 } else {
 storeList.innerHTML = '<div class="error-state"><div>😢 附近没找到相关店铺</div><div style="font-size:12px;margin-top:8px;color:#999;">试试用下方按钮去地图搜索</div></div>';
 }
 } catch (error) {
 console.error('搜索失败', error);
 storeList.innerHTML = `<div class="error-state"><div>😢 搜索失败</div><div style="margin-top:8px;">${error.message || '请稍后重试'}</div><button class="retry-btn" onclick="searchNearbyStores()">重新搜索</button></div>`;
 }
}

// 按关键词搜索高德API
function searchByKeyword(keyword) {
 return new Promise((resolve, reject) => {
 const url = `https://restapi.amap.com/v3/place/around?key=${amapKey}&location=${currentLocation}&keywords=${encodeURIComponent(keyword)}&city=${encodeURIComponent(currentCity)}&radius=10000&offset=15&extensions=all&types=050000|080000|100000|110000`;
 
 const xhr = new XMLHttpRequest();
 xhr.timeout = 10000;
 
 xhr.onload = function() {
 if (xhr.status === 200) {
 try {
 const data = JSON.parse(xhr.responseText);
 if (data.status === '1' && data.pois && data.pois.length > 0) {
 const stores = data.pois.map(poi => ({
 name: poi.name || '未知店铺',
 address: poi.address || '暂无地址',
 distance: parseFloat(poi.distance) || 0,
 location: poi.location || '',
 rating: poi.biz_ext?.rating ? parseFloat(poi.biz_ext.rating) : null,
 tel: poi.tel || ''
 }));
 resolve(stores);
 } else {
 resolve([]);
 }
 } catch (e) {
 reject(new Error('解析数据失败'));
 }
 } else {
 reject(new Error('网络请求失败'));
 }
 };
 
 xhr.onerror = function() {
 reject(new Error('网络连接失败'));
 };
 
 xhr.ontimeout = function() {
 reject(new Error('请求超时'));
 };
 
 xhr.open('GET', url, true);
 xhr.send();
 });
}

// 格式化距离
function formatDistance(meters) {
 if (meters < 1000) {
 return meters.toFixed(0) + 'm';
 } else {
 return (meters / 1000).toFixed(1) + 'km';
 }
}

// 渲染店铺列表
function renderStoreList(stores) {
 nearbyTitle.innerHTML = `<span>📍</span><span>找到 ${stores.length} 家附近店铺</span>`;
 
 storeList.innerHTML = stores.map((store, index) => `
 <div class="store-item" onclick="navigateToStore(${index})" data-index="${index}">
 <div class="store-header">
 <div class="store-name">
 <span>🏠</span>
 <span>${store.name}</span>
 </div>
 <div style="display:flex;align-items:center;gap:8px;">
 ${store.rating ? `<span class="store-rating">⭐ ${store.rating}</span>` : ''}
 <span class="store-distance">📏 ${formatDistance(store.distance)}</span>
 </div>
 </div>
 <div class="store-address">
 <span>📍</span>
 <span>${store.address}</span>
 </div>
 ${store.location ? `<div class="store-nav-btn" onclick="event.stopPropagation();navigateToStore(${index})">🧭 导航到这家店</div>` : ''}
 </div>
 `).join('');
 
 // 保存店铺数据供导航使用
 window.currentStores = stores;
}

// 导航到指定店铺
function navigateToStore(index) {
 const store = window.currentStores[index];
 if (!store || !store.location) {
 showToast('无法获取店铺位置');
 return;
 }
 
 const [lng, lat] = store.location.split(',');
 const isWechat = /MicroMessenger/i.test(navigator.userAgent);
 
 if (isWechat) {
 // 微信内：跳高德H5地图导航页
 const h5Url = `https://m.amap.com/navi/?dest=${lng},${lat},${encodeURIComponent(store.name)}&hideRouteIcon=1&key=${amapKey}`;
 window.location.href = h5Url;
 } else {
 // 非微信：用高德URI唤APP导航，带callnative
 const navUrl = `https://uri.amap.com/navigation?to=${lng},${lat},${encodeURIComponent(store.name)}&mode=car&callnative=1`;
 window.location.href = navUrl;
 }
}

// 复制到剪贴板并提示
async function copyToClipboard(text, platform) {
 try {
 await navigator.clipboard.writeText(text);
 showToast(`已复制"${text}"\n打开${platform}粘贴搜索`);
 } catch (err) {
 // 降级方案：使用旧方法
 const textarea = document.createElement('textarea');
 textarea.value = text;
 textarea.style.position = 'fixed';
 textarea.style.opacity = '0';
 document.body.appendChild(textarea);
 textarea.select();
 try {
 document.execCommand('copy');
 showToast(`已复制"${text}"\n打开${platform}粘贴搜索`);
 } catch (e) {

 }
}
